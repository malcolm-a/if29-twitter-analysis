<svg xmlns="http://www.w3.org/2000/svg" width="1250" height="720" viewBox="0 0 1250 720">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#2563eb"/>
    </marker>
    <style>
      .title { font: 700 21px Arial, sans-serif; fill: #111827; }
      .subtitle { font: 700 17px Arial, sans-serif; fill: #111827; }
      .text { font: 15px Arial, sans-serif; fill: #1f2937; }
      .small { font: 13px Arial, sans-serif; fill: #475569; }
      .mono { font: 13px Menlo, Consolas, monospace; fill: #111827; }
      .label { font: 12px Arial, sans-serif; fill: #2563eb; }
      .box { stroke-width: 2; rx: 12; ry: 12; }
      .arrow { stroke: #2563eb; stroke-width: 3; fill: none; marker-end: url(#arrow); }
      .dashed { stroke-dasharray: 8 6; }
    </style>
  </defs>

  <rect x="20" y="20" width="1210" height="680" rx="18" fill="#ffffff" stroke="#d1d5db" stroke-width="2"/>

  <rect x="55" y="90" width="210" height="105" class="box" fill="#fefce8" stroke="#facc15"/>
  <text x="160" y="128" text-anchor="middle" class="title">Donnee brute</text>
  <text x="160" y="158" text-anchor="middle" class="text">Fichiers JSON Twitter</text>
  <text x="160" y="181" text-anchor="middle" class="small">fournis par le professeur</text>

  <line x1="265" y1="143" x2="345" y2="143" class="arrow"/>
  <text x="305" y="126" text-anchor="middle" class="label">lecture</text>

  <rect x="345" y="90" width="215" height="105" class="box" fill="#f0f9ff" stroke="#38bdf8"/>
  <text x="452" y="128" text-anchor="middle" class="title">Script ingestion</text>
  <text x="452" y="158" text-anchor="middle" class="mono">ingest.py</text>
  <text x="452" y="181" text-anchor="middle" class="small">parse JSON + batch SQL</text>

  <line x1="560" y1="143" x2="645" y2="143" class="arrow"/>
  <text x="603" y="126" text-anchor="middle" class="label">insert SQL</text>
  <text x="603" y="164" text-anchor="middle" class="small">psycopg2</text>

  <rect x="645" y="55" width="540" height="390" rx="16" fill="#eff6ff" stroke="#60a5fa" stroke-width="3"/>
  <text x="915" y="92" text-anchor="middle" class="title">VPS DigitalOcean</text>
  <text x="915" y="118" text-anchor="middle" class="small">Droplet Ubuntu/Docker hebergeant la base commune du projet</text>

  <rect x="690" y="145" width="450" height="270" rx="14" fill="#eef2ff" stroke="#818cf8" stroke-width="2"/>
  <text x="915" y="180" text-anchor="middle" class="title">PostgreSQL</text>
  <text x="915" y="205" text-anchor="middle" class="small">base centrale du projet, environ 30 Go</text>

  <rect x="720" y="240" width="100" height="105" class="box" fill="#ffffff" stroke="#a5b4fc"/>
  <text x="770" y="270" text-anchor="middle" class="subtitle">tweets</text>
  <text x="770" y="298" text-anchor="middle" class="small">tweet brut</text>
  <text x="770" y="322" text-anchor="middle" class="mono">raw_data</text>
  <text x="770" y="340" text-anchor="middle" class="small">JSONB</text>

  <line x1="820" y1="292" x2="880" y2="292" class="arrow"/>

  <rect x="880" y="240" width="100" height="105" class="box" fill="#ffffff" stroke="#a5b4fc"/>
  <text x="930" y="270" text-anchor="middle" class="subtitle">users</text>
  <text x="930" y="298" text-anchor="middle" class="small">snapshot profil</text>
  <text x="930" y="322" text-anchor="middle" class="mono">user_id</text>

  <line x1="980" y1="292" x2="1040" y2="292" class="arrow"/>

  <rect x="1040" y="240" width="80" height="105" class="box" fill="#ffffff" stroke="#a5b4fc"/>
  <text x="1080" y="270" text-anchor="middle" class="subtitle" style="font-size:14px">user_features</text>
  <text x="1080" y="300" text-anchor="middle" class="small">vue ML</text>
  <text x="1080" y="324" text-anchor="middle" class="small">features</text>

  <rect x="755" y="365" width="320" height="35" rx="8" fill="#f0fdf4" stroke="#4ade80" stroke-width="2"/>
  <text x="915" y="388" text-anchor="middle" class="text">feature engineering SQL dans PostgreSQL</text>

  <line x1="1080" y1="345" x2="1080" y2="470" class="arrow"/>
  <text x="1120" y="440" text-anchor="middle" class="label">features</text>

  <path d="M 930 345 C 930 455, 235 425, 235 520" class="arrow dashed"/>
  <text x="515" y="438" text-anchor="middle" class="label">echantillonnage depuis la base</text>

  <rect x="55" y="505" width="250" height="95" class="box" fill="#fff7ed" stroke="#fb923c"/>
  <text x="180" y="538" text-anchor="middle" class="title" style="font-size:19px">Labellisation manuelle</text>
  <text x="180" y="566" text-anchor="middle" class="small">sample users extrait de PostgreSQL</text>
  <text x="180" y="586" text-anchor="middle" class="small">420 profils gardes avec label humain/bot</text>

  <line x1="305" y1="552" x2="430" y2="552" class="arrow"/>
  <text x="368" y="534" text-anchor="middle" class="label">labels</text>

  <rect x="430" y="505" width="230" height="95" class="box" fill="#f8fafc" stroke="#94a3b8"/>
  <text x="545" y="538" text-anchor="middle" class="title" style="font-size:19px">Dataset modelisation</text>
  <text x="545" y="566" text-anchor="middle" class="small">jointure</text>
  <text x="545" y="586" text-anchor="middle" class="mono">labels + user_features</text>

  <path d="M 1080 470 C 950 552, 770 552, 660 552" class="arrow"/>
  <text x="835" y="535" text-anchor="middle" class="label">jointure features</text>

  <line x1="660" y1="552" x2="780" y2="552" class="arrow"/>

  <rect x="780" y="505" width="205" height="95" class="box" fill="#fdf2f8" stroke="#f472b6"/>
  <text x="882" y="538" text-anchor="middle" class="title" style="font-size:19px">Modeles</text>
  <text x="882" y="566" text-anchor="middle" class="small">RF, SVM, K-means, spectral</text>

  <line x1="985" y1="552" x2="1065" y2="552" class="arrow"/>

  <rect x="1065" y="505" width="120" height="95" class="box" fill="#fafafa" stroke="#a3a3a3"/>
  <text x="1125" y="538" text-anchor="middle" class="title" style="font-size:19px">Analyse</text>
  <text x="1125" y="566" text-anchor="middle" class="small">scores</text>
  <text x="1125" y="586" text-anchor="middle" class="small">plots</text>
</svg>
